# Every push to main deploys daviddn.dev through the shared system in daviddn06/deploy.
# Run by hand (Actions, Deploy, Run workflow) to deploy again, roll back or see the status.
# Off switch: set the Actions variable AUTODEPLOY to "off".
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, rollback, status]
        default: deploy
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    uses: daviddn06/deploy/.github/workflows/deploy.yml@main
    with:
      project: daviddn-dev
      targets: site
      action: ${{ inputs.action || 'deploy' }}
      install: npm ci --no-audit --no-fund
      build: npm run build
      ship: dist
    secrets: inherit
